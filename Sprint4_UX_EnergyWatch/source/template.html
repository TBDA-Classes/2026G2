<style>
/* Design plan — "quiet control room": cool paper ground, deep teal for the model, signal amber/red only for what needs a person.
   Layout: left rail with 8 screens, sticky filter bar (period / zone / load), one task per screen, details in a slide-over. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#F5F8F9; --ink:#10242E; --muted:#586B76; --line:#D8E0E5;
  --brand:#0E5A6B; --brand-2:#1B7F94; --brand-soft:#DCEEF2; --band:rgba(27,127,148,.16);
  --ok:#1C7F57; --ok-soft:#DDF1E8; --warn:#B87400; --warn-soft:#FBEBC8; --high:#C23B35; --high-soft:#F8DAD7;
  --ooh:rgba(16,36,46,.055); --shadow:0 1px 2px rgba(16,36,46,.06),0 6px 18px rgba(16,36,46,.05);
  --font-d:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif; --font-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --font-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --rail:212px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B171D; --surface:#12242C; --surface-2:#0F1E25; --ink:#E5EEF1; --muted:#93A8B2; --line:#243A44;
  --brand:#63C6D8; --brand-2:#3FA7BC; --brand-soft:#173843; --band:rgba(99,198,216,.17);
  --ok:#4CC593; --ok-soft:#14352A; --warn:#F0B13E; --warn-soft:#3B2E10; --high:#FF7B72; --high-soft:#43201F;
  --ooh:rgba(229,238,241,.05); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B171D; --surface:#12242C; --surface-2:#0F1E25; --ink:#E5EEF1; --muted:#93A8B2; --line:#243A44;
  --brand:#63C6D8; --brand-2:#3FA7BC; --brand-soft:#173843; --band:rgba(99,198,216,.17);
  --ok:#4CC593; --ok-soft:#14352A; --warn:#F0B13E; --warn-soft:#3B2E10; --high:#FF7B72; --high-soft:#43201F;
  --ooh:rgba(229,238,241,.05); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-b);padding-block:0 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-d);margin:0;letter-spacing:-.01em;text-wrap:balance}
.app{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:26px}
.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* rail */
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:20px 0;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:700 17px/1.1 var(--font-d);display:block}
.brand span{font-size:11.5px;color:var(--muted);display:block}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;background:none;border-radius:10px;text-align:left;color:var(--muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.nav .badge{margin-left:auto;font:500 11px var(--font-m);background:var(--high);color:#fff;border-radius:99px;padding:1px 7px}
.railfoot{margin-top:auto;font-size:12px;color:var(--muted);display:grid;gap:8px;padding:0 6px}
.railfoot .model{background:var(--brand-soft);color:var(--brand);border-radius:10px;padding:8px 10px;font-weight:500}
.railfoot .model small{display:block;color:var(--muted);font-weight:400}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:12px;color:var(--muted);justify-self:start}

/* top bar */
main{min-width:0;padding-top:18px}
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:12px 0 12px;display:grid;gap:10px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top:before{content:"";position:absolute;left:-60px;right:-60px;top:-30px;height:30px;background:var(--bg)}
.titlerow{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.titlerow h1{font-size:26px}
.titlerow p{margin:2px 0 0;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.f label{font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px}
select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 28px 6px 10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat;min-height:34px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;color:var(--muted);font-weight:500;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.seg.zone button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gear{margin-left:auto;display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;min-height:34px;font-weight:500}
.gear svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}

/* generic */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2{font-size:17px;margin-bottom:3px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.eyebrow{font:500 10.5px var(--font-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-weight:600;font-size:12px;white-space:nowrap}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.High{background:var(--high-soft);color:var(--high)}.pill.Warning{background:var(--warn-soft);color:var(--warn)}.pill.Normal{background:var(--ok-soft);color:var(--ok)}
.pill.data{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;font-weight:500;min-height:34px}
.btn:hover{border-color:var(--brand-2);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--brand-2);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12.5px}
.note.warn{border-left-color:var(--warn)}
.note b{color:var(--ink)}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;min-width:0}
.kpi .v{font:600 25px/1.15 var(--font-d);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v small{font:500 12px var(--font-b);color:var(--muted);margin-left:3px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hl{border-color:var(--warn);}
.status{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.status .light{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 20px var(--font-d)}
.status.High .light{background:var(--high)}.status.Warning .light{background:var(--warn)}.status.Normal .light{background:var(--ok)}
.status h2{font-size:19px}

/* tables */
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 10.5px var(--font-b);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none;position:sticky;top:0;background:var(--surface)}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
th[aria-sort]:after{content:attr(data-arrow);margin-left:5px;color:var(--brand)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.sev-bar{width:4px;border-radius:4px;display:inline-block;height:26px;vertical-align:middle;margin-right:9px}
.sev-bar.High{background:var(--high)}.sev-bar.Warning{background:var(--warn)}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--brand-2);border-radius:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12.5px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* charts */
.chart{width:100%;height:380px}.chart.sm{height:300px}.chart.xs{height:230px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.lg-line{width:20px;height:0;border-top:2px solid var(--ink)}.lg-dash{width:20px;height:0;border-top:2px dashed var(--brand-2)}
.lg-band{width:20px;height:11px;background:var(--band);border-radius:3px}.lg-ooh{width:20px;height:11px;background:var(--ooh);border:1px solid var(--line);border-radius:3px}
.lg-tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--high)}
.lg-x{font-style:normal;color:var(--muted);font-weight:700;width:14px;text-align:center}

/* daily bars */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:7px;align-items:end;height:210px}
.day{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:0;min-width:0;cursor:default}
.day .col{display:flex;flex-direction:column-reverse;width:100%}
.day .col i{display:block;width:100%}
.day .base{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand-2) 40%,transparent);border-radius:0 0 4px 4px}
.day .w{background:var(--warn)}.day .h{background:var(--high);border-radius:4px 4px 0 0}
.day small{display:block;text-align:center;font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.2}
.day small b{display:block;color:var(--ink);font-weight:500}
.day .ev{text-align:center;font:500 10.5px var(--font-m);height:16px;color:var(--muted)}

/* floor */
.plan{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:1.55;background:var(--surface-2);border:2px solid var(--ink);border-radius:8px;padding:10px;position:relative}
.plan:after{content:"N ↑";position:absolute;right:12px;top:-24px;font:500 12px var(--font-m);color:var(--muted)}
.zcard{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;overflow:hidden}
.zcard:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--ok)}
.zcard.Warning:before{background:var(--warn)}.zcard.High:before{background:var(--high)}
.zcard[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.zcard:hover{border-color:var(--brand-2)}
.zcard .z{font:700 22px var(--font-d)}
.zcard .m{font-size:12px;color:var(--muted)}
.zcard .k{display:flex;gap:14px;margin-top:auto;font:500 12px var(--font-m)}
.zcard.dim{opacity:.45}

/* heatmap */
.hm{display:grid;grid-template-columns:78px repeat(24,minmax(0,1fr));gap:2px;font-size:10.5px}
.hm .hh{text-align:center;color:var(--muted);padding-bottom:3px;font-family:var(--font-m)}
.hm .hh.o{background:var(--ooh);border-radius:4px}
.hm .rl{color:var(--muted);padding-right:6px;text-align:right;align-self:center;font-size:11.5px}
.hm .rl.we{color:var(--ink);font-weight:500}
.hm .c{height:24px;border-radius:3px;background:var(--surface-2);position:relative}
.hm .c.o{background:var(--ooh)}
.hm .c.x{outline:1px solid color-mix(in srgb,var(--high) 55%,transparent)}
.hm .c:hover{outline:2px solid var(--ink);z-index:2}
.scale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.scale i{display:inline-block;width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface-2),var(--warn),var(--high))}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,20,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:61;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:20px max(18px,env(safe-area-inset-right,0px)) 30px 20px;border-left:1px solid var(--line);box-shadow:-20px 0 40px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;font-size:16px;line-height:1}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.fact b{display:block;font:600 18px var(--font-d);font-variant-numeric:tabular-nums}
.fact span{font-size:11.5px;color:var(--muted)}
ul.check{margin:6px 0 0;padding-left:18px;color:var(--ink)}ul.check li{margin:3px 0}
.field{display:grid;gap:5px;margin-bottom:14px}.field>label{font-weight:600}
.field input[type=number]{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);width:110px;min-height:34px}
.hint{font-size:12px;color:var(--muted)}

/* replay */
.rpbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input[type=range]{accent-color:var(--brand-2);width:100%}
.feed{display:grid;gap:8px;max-height:392px;overflow:auto}
.feeditem{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.feeditem{animation:none}.drawer{transition:none}}

/* mobile */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g23,.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:50;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);flex-direction:row}
  .brand,.railfoot{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%;gap:2px}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 9px;flex:none;align-items:center;text-align:center}
  .nav .badge{display:none}
  body{padding-bottom:90px}
  .top{position:static}.top:before{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .titlerow h1{font-size:22px}
  .chart{height:320px}
  .hm{grid-template-columns:54px repeat(24,minmax(0,1fr))}.hm .hh:nth-child(odd){visibility:hidden}
  .plan{aspect-ratio:auto;grid-template-rows:auto auto;min-height:0}
}
</style>

const f0=v=>Math.round(v).toLocaleString('en-GB'),f1=v=>v.toLocaleString('en-GB',{minimumFractionDigits:1,maximumFractionDigits:1}),f2=v=>v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});

function periodRange(){const p=S.period;if(p==='all')return[0,N];if(p==='w1')return[0,168];if(p==='w2')return[168,N];if(p.startsWith('d')){const d=DAYS[+p.slice(1)];return[d.s,d.e];}return[0,N];}
function scopeCircuits(){return C.map((c,k)=>k).filter(k=>(S.zone==='ALL'||C[k].zone===S.zone)&&(S.load==='ALL'||C[k].load===S.load));}
const inScope=k=>(S.zone==='ALL'||C[k].zone===S.zone)&&(S.load==='ALL'||C[k].load===S.load);
function periodLabel(){const[r0,r1]=periodRange();const a=L[r0],b=L[r1-1];if(S.period==='all')return'22 Sep – 5 Oct 2025';if(S.period==='w1')return'22–28 Sep 2025 (validation week)';if(S.period==='w2')return'29 Sep – 5 Oct 2025 (test week)';return a.dl+' 2025';}
function scopeLabel(){const z=S.zone==='ALL'?'All zones':'Zone '+S.zone;const l=S.load==='ALL'?'all load types':LOADLBL[S.load];return`${z} · ${l}`;}
function events(){const[r0,r1]=periodRange();return D.det[S.sens].events.filter(e=>inScope(e.c)&&e.s<r1&&e.e>r0);}
function alertHours(){const[r0,r1]=periodRange();return D.det[S.sens].hours.filter(h=>inScope(h[0])&&h[1]>=r0&&h[1]<r1);}
const money=k=>({eur:k*S.price,co2:k*S.co2});
function totals(){const[r0,r1]=periodRange();let a=0,e=0,n=0,tot=0;
  for(const k of scopeCircuits()){for(let i=r0;i<r1;i++){tot++;const av=D.actual[k][i];if(av==null)continue;a+=av;e+=D.expected[k][i];n++;}}
  const ah=alertHours();let ex=0,exH=0,exW=0;for(const h of ah){ex+=h[2];const ev=D.det[S.sens].events[h[3]];if(ev.sev==='High')exH+=h[2];else exW+=h[2];}
  return{actual:a,expected:e,valid:n,total:tot,excess:ex,exHigh:exH,exWarn:exW};}
function status(evs){return evs.some(e=>e.sev==='High')?'High':evs.length?'Warning':'Normal';}
const sevLabel={High:'High',Warning:'Warning',Normal:'Normal'};

function runs(arr,r0,r1){const o=[];let s=null;for(let i=r0;i<r1;i++){if(arr[i]&&s===null)s=i;if((!arr[i]||i===r1-1)&&s!==null){o.push([s,arr[i]&&i===r1-1?i+1:i]);s=null;}}return o;}
function oohShapes(r0,r1){const c=themeColors();return runs(D.ooh,r0,r1).map(([a,b])=>({type:'rect',xref:'x',yref:'paper',x0:L[a].iso,x1:b<N?L[b].iso:L[N-1].iso,y0:0,y1:1,fillcolor:c.ooh,line:{width:0},layer:'below'}));}
function series(ks,r0,r1){const x=[],a=[],e=[],lo=[],hi=[],cov=[];for(let i=r0;i<r1;i++){let sa=0,se=0,sl=0,sh=0,n=0;for(const k of ks){const v=D.actual[k][i];if(v==null)continue;sa+=v;se+=D.expected[k][i];sl+=D.lo[k][i];sh+=D.hi[k][i];n++;}
  x.push(L[i].iso);cov.push(n);if(n===0){a.push(null);e.push(null);lo.push(null);hi.push(null);}else{a.push(sa);e.push(se);lo.push(sl);hi.push(sh);}}return{x,a,e,lo,hi,cov};}
function copy(text,btn){const done=()=>{const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1400);};

function sevWhy(e){const r=[];if(e.excess>=1)r.push(`excess of ${f1(e.excess)} kWh is at least 1 kWh`);if(e.n>=6)r.push(`it lasted ${e.n} hours (6 or more)`);if(e.ooh>=.5&&e.excess>=.5)r.push(`most of it is outside occupied hours and the excess is at least 0.5 kWh`);return e.sev==='High'?'High because '+r.join(' and ')+'.':'Warning: above the normal range, but below the thresholds for High (1 kWh, 6 hours, or 0.5 kWh mostly out of hours).';}

  // heatmap
  const dIdx=DAYS.map((d,i)=>i).filter(i=>DAYS[i].e>r0&&DAYS[i].s<r1);const M={};let mx=0;const hoursAgg={};
  for(const h of alertHours()){const d=DAYS.findIndex(x=>h[1]>=x.s&&h[1]<x.e);const k=d+'_'+L[h[1]].hr;M[k]=(M[k]||0)+h[2];mx=Math.max(mx,M[k]);hoursAgg[L[h[1]].hr]=(hoursAgg[L[h[1]].hr]||0)+h[2];}
  const hrs=[...Array(24).keys()];const occH=D.meta.occ;
  const topH=Object.entries(hoursAgg).sort((a,b)=>b[1]-a[1]).slice(0,5);const totEx=Object.values(hoursAgg).reduce((s,x)=>s+x,0);const oohEx=Object.entries(hoursAgg).reduce((s,[h,x])=>s+(+h<occH[0]||+h>=occH[1]?x:0),0);
  box.innerHTML=`<div class="grid g23"><div class="card"><h2>Where excess use repeats</h2><p class="sub">Each cell is the excess in kWh for one hour on one day (Madrid time). Shaded columns are outside occupied hours (before ${String(occH[0]).padStart(2,'0')}:00, from ${occH[1]}:00, and all weekends).</p>
   <div class="hm"><div></div>${hrs.map(h=>`<div class="hh ${h<occH[0]||h>=occH[1]?'o':''}">${h}</div>`).join('')}${dIdx.map(i=>{const d=DAYS[i];return`<div class="rl ${d.we?'we':''}">${d.dl}</div>`+hrs.map(h=>{const val=M[i+'_'+h]||0;const have=d.s<=r1&&true;const ooh=d.we||h<occH[0]||h>=occH[1];const pc=val?Math.round(20+80*Math.sqrt(val/mx)):0;return`<div class="c ${ooh?'o':''} ${val?'x':''}" ${val?`style="background:color-mix(in srgb,var(--high) ${pc}%,var(--surface))"`:''} title="${d.dl} ${String(h).padStart(2,'0')}:00 — ${val?f2(val/1000)+' kWh excess':'no excess'}"></div>`;}).join('');}).join('')}</div>
   <div class="scale" style="margin-top:12px"><span>None</span><i></i><span>${f2(mx/1000)} kWh</span><span style="margin-left:14px" class="tag">Shaded = out of hours</span></div></div>
   <div class="card"><h2>Reading the pattern</h2>${totEx?`<div class="facts" style="grid-template-columns:1fr 1fr"><div class="fact"><b>${Math.round(100*oohEx/totEx)}%</b><span>of excess happens out of hours</span></div><div class="fact"><b>${f1(totEx/1000)} kWh</b><span>total excess in this view</span></div></div><div class="eyebrow" style="margin-top:8px">Hours with the most excess</div>${topH.map(([h,x])=>`<div style="display:flex;gap:10px;align-items:center;margin:6px 0"><span class="mono" style="width:46px">${String(h).padStart(2,'0')}:00</span><div class="bar" style="flex:1"><i style="width:${100*x/topH[0][1]}%;background:var(--high)"></i></div><span class="num" style="min-width:56px;text-align:right">${f1(x/1000)} kWh</span></div>`).join('')}<p class="hint">Repeated cells in the same hour on several days point to a schedule problem (something that is left on at the same time every day), not a one-off.</p>`:'<div class="empty">No excess in this selection.</div>'}</div></div></div>`;};

VIEWS.savings=v=>{const evs=events(),T=totals(),ah=alertHours();const by=S.sv.by;const keyf={circuit:e=>C[e.c].zone+' · '+C[e.c].label,load:e=>C[e.c].label,zone:e=>'Zone '+C[e.c].zone}[by];
  const g={};for(const e of evs){const[r0,r1]=periodRange();let x=0;for(const h of ah)if(h[3]===D.det[S.sens].events.indexOf(e))x+=h[2];const k=keyf(e);g[k]=(g[k]||0)+x/1000;}
  const rows=Object.entries(g).sort((a,b)=>b[1]-a[1]);const tot=rows.reduce((s,r)=>s+r[1],0);const f=30/((periodRange()[1]-periodRange()[0])/24);const wk=[0,1].map(w=>{let x=0;for(const h of D.det[S.sens].hours)if(inScope(h[0])&&h[1]>=w*168&&h[1]<(w+1)*168)x+=h[2];return x/1000;});
  v.innerHTML=`<div class="grid"><div class="note warn"><b>Estimated, not confirmed.</b> Savings are the excess energy above the normal range multiplied by the assumed price and CO₂ factor (${S.price.toFixed(2)} €/kWh, ${S.co2.toFixed(2)} kg/kWh). Only 14 days of forecasts exist, so the “per month” figures are those 14 days scaled to 30 days. Change the assumptions in Settings.</div>
   <div class="grid g3"><div class="kpi"><div class="eyebrow">Excess energy · ${periodLabel()}</div><div class="v">${f1(tot)}<small>kWh</small></div><div class="d">${f2(tot*S.price)} € · ${f1(tot*S.co2)} kg CO₂</div></div>
   <div class="kpi hl"><div class="eyebrow">Per month (scaled to 30 days)</div><div class="v">${f0(tot*f)}<small>kWh</small></div><div class="d">${f0(tot*f*S.price)} € · ${f0(tot*f*S.co2)} kg CO₂ per month</div></div>
   <div class="kpi"><div class="eyebrow">Per year if it repeats</div><div class="v">${f0(tot*f*12)}<small>kWh</small></div><div class="d">${f0(tot*f*12*S.price)} € · ${f0(tot*f*12*S.co2/1000*10)/10} t CO₂</div></div></div>
   <div class="grid g23"><div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">Main sources of excess</h2><div class="seg" style="margin-left:auto" role="group" aria-label="Group by">${[['circuit','Circuit'],['load','Load type'],['zone','Zone']].map(([k,n])=>`<button type="button" data-by="${k}" aria-pressed="${by===k}">${n}</button>`).join('')}</div></div>
    <div class="tablewrap"><table><thead><tr><th>${by==='circuit'?'Circuit':by==='load'?'Load type':'Zone'}</th><th>Share</th><th class="r">kWh</th><th class="r">Est. €</th><th class="r">Est. CO₂ kg</th></tr></thead><tbody>${rows.length?rows.map(([k,x])=>`<tr><td>${esc(k)}</td><td style="min-width:120px"><div class="bar"><i style="width:${100*x/rows[0][1]}%"></i></div></td><td class="r num"><b>${f1(x)}</b></td><td class="r num">${f2(x*S.price)}</td><td class="r num">${f1(x*S.co2)}</td></tr>`).join(''):'<tr><td colspan="5"><div class="empty">No excess in this selection.</div></td></tr>'}</tbody></table></div>
    <div style="margin-top:12px"><button type="button" class="btn" id="csv2">Copy as CSV</button></div></div>
   <div class="card"><h2>Week by week</h2><p class="sub">Excess energy in each week of the data.</p>${wk.map((x,i)=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>Week ${i+1} <span class="hint">${i?'29 Sep–5 Oct':'22–28 Sep'}</span></span><b class="num">${f1(x)} kWh · ${f2(x*S.price)} €</b></div><div class="bar" style="margin-top:5px;height:12px"><i style="width:${100*x/Math.max(...wk,.01)}%;background:var(--warn)"></i></div></div>`).join('')}<div class="hint">A real monthly report needs at least one full month of forecasts. Run the frozen model on more weeks to extend it.</div></div></div></div>`;
  $$('[data-by]',v).forEach(b=>b.onclick=()=>{S.sv.by=b.dataset.by;render();});
  $('#csv2').onclick=e=>copy(['source,excess_kwh,est_cost_eur,est_co2_kg'].concat(rows.map(([k,x])=>`"${k}",${x.toFixed(3)},${(x*S.price).toFixed(2)},${(x*S.co2).toFixed(2)}`)).join('\n'),e.target);};

let RT=null;function stopReplay(){S.rp.playing=false;if(RT){cancelAnimationFrame(RT);RT=null;}}
VIEWS.replay=v=>{const R=S.rp;const ks=scopeCircuits();const[p0,p1]=periodRange();if(R.i<p0||R.i>p1-1)R.i=p0;
  v.innerHTML=`<div class="grid"><div class="note">Pick a period and press play: the building is replayed hour by hour as if it were live. Alerts appear when the actual use first leaves the normal range. This uses stored data only, nothing is connected to the building.</div>
   <div class="card"><div class="rpbar"><button type="button" class="btn primary" id="rpplay">${R.playing?'Pause':'Play'}</button><button type="button" class="btn" id="rprst">Restart</button>
    <div class="seg" role="group" aria-label="Speed">${[[3,'Slow'],[8,'Normal'],[24,'Fast']].map(([s,n])=>`<button type="button" data-sp="${s}" aria-pressed="${R.speed===s}">${n}</button>`).join('')}</div><span class="mono" id="rpclock" style="margin-left:auto;font-size:16px"></span></div>
    <input id="rpsl" type="range" min="${p0}" max="${p1-1}" value="${R.i}" step="1" aria-label="Replay position" style="margin:12px 0 4px"><div id="rpch" class="chart sm"></div>
    <div class="legend"><span><i class="lg-line"></i>Actual so far</span><span><i class="lg-dash"></i>Expected</span><span><i class="lg-band"></i>Normal range</span><span><i class="lg-tri"></i>Alert raised</span></div></div>
   <div class="grid g2"><div class="card"><h2>So far</h2><div class="facts" id="rpk"></div></div><div class="card"><h2>Alert feed</h2><div class="feed" id="rpfeed"></div></div></div></div>`;
  const sr=series(ks,p0,p1),c=themeColors();let lastN=-1;
  function draw(){const i=R.i,n=i-p0+1;const a=sr.a.map((x,j)=>j<n?x:null);const evsAll=D.det[S.sens].events.filter(e=>ks.includes(e.c)&&e.s<=i&&e.e>p0&&e.s>=p0-0);
    const mk=evsAll.map(e=>({x:L[e.s].iso,y:sr.a[e.s-p0]??sr.e[e.s-p0],sev:e.sev}));
    const data=[{x:sr.x,y:sr.hi,mode:'lines',line:{width:0},hoverinfo:'skip'},{x:sr.x,y:sr.lo,mode:'lines',line:{width:0},fill:'tonexty',fillcolor:c.band,hoverinfo:'skip'},{x:sr.x,y:sr.e,mode:'lines',line:{color:c.brand,width:2,dash:'dash'},hovertemplate:'%{y:.0f} Wh',name:'Expected'},{x:sr.x,y:a,mode:'lines',line:{color:c.ink,width:2},hovertemplate:'%{y:.0f} Wh',name:'Actual'},{x:mk.map(m=>m.x),y:mk.map(m=>m.y),mode:'markers',marker:{symbol:'triangle-up',size:12,color:mk.map(m=>m.sev==='High'?c.high:c.warn),line:{color:c.surface,width:1.5}},hoverinfo:'skip'}];
    plot($('#rpch'),data,baseLayout(300,{shapes:oohShapes(p0,p1).concat([{type:'line',xref:'x',yref:'paper',x0:L[i].iso,x1:L[i].iso,y0:0,y1:1,line:{color:c.brand,width:1.5}}]),xaxis:{gridcolor:c.line,type:'date',tickformat:'%a %d',hoverformat:'%a %d %b %H:%M',range:[L[p0].iso,L[p1-1].iso]}}));
    $('#rpclock').textContent=L[i].short+' (Madrid)';$('#rpsl').value=i;
    let used=0,exc=0;for(const k of ks)for(let h=p0;h<=i;h++){const x=D.actual[k][h];if(x!=null)used+=x;}for(const h of D.det[S.sens].hours)if(ks.includes(h[0])&&h[1]>=p0&&h[1]<=i)exc+=h[2];
    $('#rpk').innerHTML=`<div class="fact"><b>${f0(used/1000)} kWh</b><span>used so far</span></div><div class="fact"><b>${f1(exc/1000)} kWh</b><span>excess so far</span></div><div class="fact"><b>${f2(exc/1000*S.price)} €</b><span>estimated cost</span></div><div class="fact"><b>${evsAll.length}</b><span>alerts raised</span></div>`;
    if(evsAll.length!==lastN){lastN=evsAll.length;$('#rpfeed').innerHTML=evsAll.length?[...evsAll].reverse().map(e=>`<div class="feeditem" style="cursor:pointer" data-open="${e.id}"><span class="sev-bar ${e.sev}" style="height:40px;margin:0"></span><div>${pill(e.sev)} <b>${esc(C[e.c].label)}</b> <span class="tag">${C[e.c].zone}</span><div class="hint">${L[e.s].short} · ${f1(e.excess)} kWh so far in total · ${e.n} h</div></div></div>`).join(''):'<div class="empty">Nothing raised yet.</div>';$$('#rpfeed [data-open]').forEach(b=>b.onclick=()=>openAlert(b.dataset.open));}}
  let last=0,acc=0;function tick(ts){if(!R.playing)return;if(!last)last=ts;acc+=(ts-last)/1000*R.speed;last=ts;if(acc>=1){const st=Math.floor(acc);acc-=st;R.i=Math.min(p1-1,R.i+st);draw();if(R.i>=p1-1){R.playing=false;$('#rpplay').textContent='Play';return;}}RT=requestAnimationFrame(tick);}
  $('#rpplay').onclick=()=>{if(R.playing){stopReplay();$('#rpplay').textContent='Play';return;}if(R.i>=p1-1)R.i=p0;R.playing=true;$('#rpplay').textContent='Pause';last=0;acc=0;RT=requestAnimationFrame(tick);};
  $('#rprst').onclick=()=>{stopReplay();R.i=p0;lastN=-1;$('#rpplay').textContent='Play';draw();};
  $$('[data-sp]',v).forEach(b=>b.onclick=()=>{R.speed=+b.dataset.sp;$$('[data-sp]',v).forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#rpsl').oninput=e=>{R.i=+e.target.value;lastN=-1;draw();};draw();};

VIEWS.reliab=v=>{const R=D.reliab,lvl=S.rel.lvl;const lv={circuit:'circuit-hour (pooled 16 circuits)',building:'building total (hours with all 16 circuits)'}[lvl];
  const rows=R.accuracy.filter(r=>r.level===lv&&r.split==='test');const models=[...new Set(rows.map(r=>r.model))];const H=['+1h','+6h','day-ahead'];
  const getr=(m,h)=>rows.find(r=>r.model===m&&r.horizon===h);
  const best=h=>Math.min(...models.map(m=>getr(m,h).MAE_Wh));
  const bandAll=R.band.filter(b=>b.horizon==='all'),bd=R.band.filter(b=>b.split==='test'&&b.horizon!=='all');
  const sensRows=Object.keys(D.meta.sens).map(s=>({s,n:D.det[s].events.length,h:D.det[s].events.filter(e=>e.sev==='High').length,kwh:D.det[s].events.reduce((a,e)=>a+e.excess,0)}));
  const totH=C.length*N;let valid=0;for(let k=0;k<NC;k++)for(let i=0;i<N;i++)if(D.actual[k][i]!=null)valid++;
  const byR={};D.issues.forEach(q=>byR[q.reason]=(byR[q.reason]||0)+(q.e-q.s));
  const nwEm=D.issues.some(q=>C[q.c].id==='NW|Emerg. Lighting'&&q.reason.startsWith('Energy higher'));
  const cov=R.band_circuit;
  v.innerHTML=`<div class="grid"><div class="grid g3">
   <div class="kpi"><div class="eyebrow">Normal range holds</div><div class="v">${bandAll.find(b=>b.split==='test').coverage_pct.toFixed(0)}<small>% of hours</small></div><div class="d">test week, target 80% · validation ${bandAll.find(b=>b.split==='validation').coverage_pct.toFixed(0)}%</div></div>
   <div class="kpi"><div class="eyebrow">Known event found</div><div class="v">${D.meta.known_event_detected[S.sens]?'Yes':'No'}</div><div class="d">NE HVAC left on, 3 Oct 11:00–14:00</div></div>
   <div class="kpi"><div class="eyebrow">Alerts per day</div><div class="v">${f1(D.det[S.sens].events.length/14)}</div><div class="d">${S.sens} sensitivity · adjustable in Settings</div></div></div>
   <div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">How accurate are the expected values?</h2><div class="seg" style="margin-left:auto" role="group" aria-label="Level"><button type="button" data-lv="circuit" aria-pressed="${lvl==='circuit'}">Each circuit</button><button type="button" data-lv="building" aria-pressed="${lvl==='building'}">Whole building</button></div></div>
    <p class="sub">Unseen test week, 29 Sep – 5 Oct 2025. Lower is better. Error is shown as MAE in Wh per hour and as a share of average use (WAPE).</p>
    <div class="tablewrap"><table><thead><tr><th>Model</th>${H.map(h=>`<th class="r">${h} MAE</th><th class="r">WAPE</th><th class="r">CV(RMSE)</th><th class="r">MAPE</th>`).join('')}</tr></thead><tbody>${models.map(m=>`<tr ${m.startsWith('Blend')?'style="background:var(--brand-soft)"':''}><td><b>${esc(m)}</b>${m.startsWith('Blend')?' <span class="tag">final model</span>':''}</td>${H.map(h=>{const r=getr(m,h);return`<td class="r num" ${r.MAE_Wh===best(h)?'style="font-weight:700;color:var(--brand)"':''}>${f1(r.MAE_Wh)}</td><td class="r num">${f0(r.WAPE_pct)}%</td><td class="r num">${f0(r.CV_RMSE_pct)}%</td><td class="r num">${f0(r.MAPE_pct)}%</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin-top:8px">${lvl==='circuit'?'Each circuit and hour counts separately, so a few large circuits dominate the error. MAPE only counts hours with at least 10 Wh actual use (it explodes near zero). Number of scored circuit-hours: '+f0(rows[0].n)+'.':'Hours where all 16 circuits have a valid reading ('+f0(rows[0].n)+' hours only). The sample is small; read it as indicative. MAPE counts hours of at least 100 Wh.'}</p>
    <div class="note" style="margin-top:8px">Against the simple baselines (B1 same hour last week, B2 weekday×hour median, B3 persistence) the final model beats B1 and B2 at every horizon and persistence clearly at +6 h. At +1 h persistence is a strong rival because consumption changes slowly, and the margin is modest there and day-ahead.</div></div>
   <div class="grid g2"><div class="card"><h2>Normal range</h2><p class="sub">Share of actual values that fell inside the Chronos-Bolt 10–90% band. A well-calibrated band holds about 80%.</p><div class="tablewrap"><table><thead><tr><th>Horizon</th><th class="r">Inside</th><th class="r">Above</th><th class="r">Below</th><th class="r">Mean width Wh</th></tr></thead><tbody>${bd.map(b=>`<tr><td>${b.horizon}</td><td class="r num"><b>${b.coverage_pct.toFixed(0)}%</b></td><td class="r num">${b.above_pct.toFixed(0)}%</td><td class="r num">${b.below_pct.toFixed(0)}%</td><td class="r num">${f0(b.mean_width_Wh)}</td></tr>`).join('')}</tbody></table></div><p class="hint">Alerts use the day-ahead band (${bd.find(b=>b.horizon==='day-ahead').coverage_pct.toFixed(0)}% inside). Circuits with a lower share: NW hand dryer ${cov.find(c=>c.series_id==='NW|Hand Dryer').coverage_pct.toFixed(0)}%, SW plugs ${cov.find(c=>c.series_id==='SW|Plugs & Sockets').coverage_pct.toFixed(0)}%.</p></div>
    <div class="card"><h2>Alert load and detection test</h2><p class="sub">The trade-off between missing events and false alarms.</p><div class="tablewrap"><table><thead><tr><th>Sensitivity</th><th class="r">Alerts</th><th class="r">per day</th><th class="r">High</th><th class="r">Excess kWh</th></tr></thead><tbody>${sensRows.map(r=>`<tr ${r.s===S.sens?'style="background:var(--brand-soft)"':''}><td>${r.s}</td><td class="r num">${r.n}</td><td class="r num">${f1(r.n/14)}</td><td class="r num">${r.h}</td><td class="r num">${f1(r.kwh)}</td></tr>`).join('')}</tbody></table></div>
     <ul class="check"><li>The only clearly known event, NE HVAC left on on 3 Oct, is found at every sensitivity.</li><li>${nwEm?'The impossible NW emergency-lighting readings of 5–6 Oct are shown as data issues, not as waste.':'Impossible readings are shown as data issues.'}</li><li>Few known events exist, so false-alarm rates cannot be measured yet; they need feedback from the building team.</li></ul></div></div>
   <div class="grid g2"><div class="card"><h2>Data readiness</h2><p class="sub">What the alerts are built on.</p><div class="facts"><div class="fact"><b>${Math.round(100*valid/totH)}%</b><span>of circuit-hours have a valid reading</span></div><div class="fact"><b>16</b><span>circuits in 4 zones (only NW has a rack circuit)</span></div></div>
     <div class="eyebrow">Hours excluded, by reason</div>${Object.entries(byR).sort((a,b)=>b[1]-a[1]).map(([r,h])=>`<div style="display:flex;justify-content:space-between;margin:5px 0"><span>${esc(r)}</span><b class="num">${h} h</b></div>`).join('')}<p class="hint">Excluded hours are listed under Alerts → Data issues and are never treated as zero.</p></div>
    <div class="card"><h2>Rules used</h2><ul class="check"><li><b>Expected value:</b> Blend v1.3 (weighted mix of gradient boosting, ChronosGBM and Chronos-Bolt), day-ahead, issued 00:00 Madrid.</li><li><b>Normal range:</b> Chronos-Bolt 10–90% band. The expected value is always kept inside it.</li><li><b>Occupied hours:</b> weekdays 07:00–20:00 Madrid, not holidays. In zones NW and SE, motion detectors register presence in 85–91% of the hours with any detected presence inside this window; NE has no detector and the SW detector is stuck on.</li><li><b>Alert hour:</b> actual above the range and excess above the sensitivity floor. Consecutive hours form one alert.</li><li><b>High severity:</b> at least 1 kWh, or 6 hours, or 0.5 kWh mostly out of hours.</li><li><b>Impact:</b> excess kWh × assumed price and CO₂ factor (estimates).</li></ul></div></div>
   <div class="card"><h2>Limits to keep in mind</h2><ul class="check"><li>The model learned from about five summer weeks (19 Aug – 21 Sep 2025) and was checked on two single weeks. It has not seen winter or the heating season.</li><li>A few large circuits dominate the error. NW plugs & sockets draw about 535 Wh every hour, day and night, and make up over half of the detected excess, so some of its alerts may reflect an always-on load rather than a new event. Causes are not confirmed.</li><li>Outdoor temperature was tested and did not improve the model, so it is not used.</li><li>Only energy (Wh) is forecast. Power and current are strongly redundant with it (median correlation of ${(R.wi.map(r=>r.corr_W_I).sort((a,b)=>a-b)[Math.floor(R.wi.length/2)]).toFixed(2)} between them) and were left out on purpose.</li></ul></div></div>`;
  $$('[data-lv]',v).forEach(b=>b.onclick=()=>{S.rel.lvl=b.dataset.lv;render();});};

/* ---------- theme ---------- */
$('#themebtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';render();};
matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
window.addEventListener('resize',()=>{if(window.Plotly)$$('.js-plotly-plot').forEach(p=>Plotly.Plots.resize(p));});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SCREENS.some(s=>s[0]===h)&&h!==S.screen){S.screen=h;stopReplay();render();}});
window.__S=S;window.__go=go;
render();
})();
</script>
